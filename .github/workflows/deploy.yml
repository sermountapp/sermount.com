# Builds the Astro site and publishes it to GitHub Pages. Holds no secrets and no deploy keys.
# Actions are pinned to commit SHAs; the tag each SHA belongs to is noted beside it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly dependency audit (the audit job only: build and deploy skip scheduled
  # runs). GitHub runs schedules from the default branch (main) and emails a
  # failed scheduled run to whoever last changed this cron line.
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # npm audit on the production dependency tree, on every push and weekly.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          check-latest: true
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact, and check-latest so the runner's cached 24.x is not used (the
          # 2026-10-09 deploy took 24.21.0 from the tool cache; 24.22.1 is the
          # 2026-10-20 security release).
          node-version: 24.22.1
          check-latest: true
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SHOW_SIGN_IN: 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
